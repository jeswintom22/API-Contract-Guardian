<!DOCTYPE html>
<html>
<head>
  <title>API Contract Guardian</title>
  <style>
    body { font-family: -apple-system, sans-serif; max-width: 560px; margin: 80px auto; color: #1a2b3c; }
    h1 { font-size: 22px; }
    label { display: block; margin-top: 16px; font-size: 14px; color: #555; }
    input { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
    button { margin-top: 24px; padding: 10px 18px; background: #0A1F33; color: white; border: none; cursor: pointer; }
  </style>
</head>
<body>
  <h1>API Contract Guardian</h1>
  <p>Point this at a repo and two refs to see what a change breaks.</p>
  <form action="/analyze" method="get">
    <label>Repo path<input name="repo_path" value="../sample-repo" required></label>
    <label>Base ref<input name="base_ref" value="main" required></label>
    <label>Head ref<input name="head_ref" value="breaking-change" required></label>
    <button type="submit">Run analysis</button>
  </form>
</body>
</html>
